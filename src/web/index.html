<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flynn Lavalink Status Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #2b2d31;
            --bg-secondary: #313338;
            --bg-tertiary: #36393f;
            --text-primary: #ffffff;
            --text-secondary: #b0b3b8;
            --accent-primary: #5865f2;
            --accent-secondary: #4e5bb1;
            --border-color: #3f4147;
        }

        .light-theme {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f8f9fa;
            --text-primary: #1a1a1a;
            --text-secondary: #65676b;
            --accent-primary: #5865f2;
            --accent-secondary: #4e5bb1;
            --border-color: #e4e6eb;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.4s, color 0.4s;
        }

        nav {
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            backdrop-filter: blur(10px);
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            background-color: var(--bg-tertiary);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent-primary);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 2rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-color);
        }

        .modal-section {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background-color: var(--bg-tertiary);
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
        }

        .modal-section h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--accent-primary);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal:hover {
            color: var(--text-primary);
        }

        .status-dot {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
                transform: scale(0.95);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }

            100% {
                opacity: 0.5;
                transform: scale(0.95);
            }
        }

        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: var(--bg-secondary);
            transform: translateY(-2px);
        }

        .loading-animation {
            display: inline-block;
            position: relative;
            width: 80px;
            height: 80px;
        }

        .loading-animation div {
            position: absolute;
            border: 4px solid var(--accent-primary);
            opacity: 1;
            border-radius: 50%;
            animation: loading-animation 1s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }

        @keyframes loading-animation {
            0% {
                top: 36px;
                left: 36px;
                width: 0;
                height: 0;
                opacity: 1;
            }

            100% {
                top: 0px;
                left: 0px;
                width: 72px;
                height: 72px;
                opacity: 0;
            }
        }
    </style>
</head>

<body class="">
    <nav class="p-4 text-white flex justify-between items-center fixed w-full top-0 z-10 shadow-lg">
        <a class="text-2xl font-bold tracking-wide flex items-center gap-2" href="#">
            <i class="fas fa-server"></i>
            <span> FLynn Lavalink Status</span>
        </a>
        <div class="flex items-center space-x-4">
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
            <a href="https://github.com/gaurav87565/Lavalink-status" target="_blank"
                class="bg-gray-700 text-gray-200 px-3 py-2 rounded-lg hover:bg-gray-600 transition flex items-center gap-2">
                <i class="fab fa-github text-xl"></i>
                <span>GitHub</span>
            </a>
        </div>
    </nav>

    <main class="container mx-auto pt-24 pb-10 flex-grow px-4">
        <div id="loading" class="loading text-center">
            <div class="loading-animation mx-auto">
                <div></div>
            </div>
            <p class="text-xl font-semibold mt-4 text-center">Loading stats...</p>
        </div>
        <div id="refresh-notice" class="text-center text-md mt-2 mb-6 text-secondary hidden">
            <i class="fas fa-sync-alt mr-2"></i>Refreshing every 60 seconds
        </div>
        <div id="stats" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
    </main>

    <div id="modal" class="modal">
        <div class="modal-content relative">
            <span class="close-modal">&times;</span>
            <div id="modal-details"></div>
        </div>
    </div>

    <footer class="py-6 text-center text-secondary bg-tertiary">
        <p>Made with <i class="fas fa-heart text-red-500"></i> by
            <a href="https://github.com/gaurav87565/Lavalink-status"
                class="text-accent-primary hover:underline">Flynn™️</a>
        </p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            const modal = document.getElementById('modal');
            const closeModalBtn = document.querySelector('.close-modal');
            const modalDetails = document.getElementById('modal-details');

            // Theme Toggle
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('light-theme');
                const icon = themeToggle.querySelector('i');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
            });

            // Modal Controls
            closeModalBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
                modal.style.display = 'none';
            });

            modal.addEventListener('click', (event) => {
                if (event.target === modal) {
                    modal.classList.add('hidden');
                    modal.style.display = 'none';
                }
            });

            async function fetchNodeInfo(nodeIndex) {
                try {
                    const response = await fetch(`/info`);
                    const info = await response.json();
                    return info[nodeIndex];
                } catch (error) {
                    console.error('Error fetching node info:', error);
                    return null;
                }
            }

            async function fetchStats() {
                try {
                    const response = await fetch('/stats');
                    const stats = await response.json();
                    const statsDiv = document.getElementById('stats');
                    const loadingDiv = document.getElementById('loading');
                    const refreshNoticeDiv = document.getElementById('refresh-notice');

                    if (!stats.length) {
                        loadingDiv.classList.remove('hidden');
                        refreshNoticeDiv.classList.add('hidden');
                    } else {
                        loadingDiv.classList.add('hidden');
                        refreshNoticeDiv.classList.remove('hidden');
                        statsDiv.innerHTML = '';

                        stats.forEach((stat, index) => {
                            const card = document.createElement('div');
                            card.className = "card p-6 cursor-pointer transition-all hover:shadow-xl";
                            card.innerHTML = `
                                <div class="flex justify-between items-center mb-4">
                                    <h2 class="font-bold text-xl">${stat.node}</h2>
                                    <span class="inline-block w-3 h-3 rounded-full ${stat.online ? 'bg-green-400' : 'bg-red-500'} status-dot"></span>
                                </div>
                                <div class="space-y-3">
                                    <div class="flex justify-between items-center">
                                        <span class="text-secondary">Status</span>
                                        <span class="font-medium">${stat.status}</span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-secondary">Players</span>
                                        <span class="font-medium">${stat.activePlayers}/${stat.players}</span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-secondary">Uptime</span>
                                        <span class="font-medium">${stat.uptime}</span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-secondary">Cores</span>
                                        <span class="font-medium">${stat.cores}</span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-secondary">Memory Usage</span>
                                        <span class="font-medium">${stat.memoryUsed} / ${stat.memoryReservable}</span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-secondary">System Load</span>
                                        <span class="font-medium">${stat.systemLoad}%</span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-secondary">Lavalink Load</span>
                                        <span class="font-medium">${stat.lavalinkLoad}%</span>
                                    </div>
                                </div>`;

                            card.addEventListener('click', async () => {
                                const nodeInfo = await fetchNodeInfo(index);
                                modalDetails.innerHTML = `
                                    <h2 class="text-2xl font-bold mb-6">Node Details: ${stat.node}</h2>
                                    <div class="space-y-4">
                                        <div class="modal-section">
                                            <h3>Lavalink Version</h3>
                                            <p class="text-lg">${nodeInfo?.version?.semver ?? 'Unknown'}</p>
                                        </div>
                                        <div class="modal-section">
                                            <h3>Lavaplayer Version</h3>
                                            <p class="text-lg">${nodeInfo?.lavaplayer ?? 'Unknown'}</p>
                                        </div>
                                        <div class="modal-section">
                                            <h3>Plugins</h3>
                                            <ul class="list-disc pl-5 space-y-1">
                                                ${(nodeInfo?.plugins?.map(p => `<li>${p.name} v${p.version}</li>`).join('') ?? '<li>Unknown</li>')}
                                            </ul>
                                        </div>
                                        <div class="modal-section">
                                            <h3>Sources</h3>
                                            <p class="text-lg">${nodeInfo?.sourceManagers?.join(', ') ?? 'Unknown'}</p>
                                        </div>
                                        <div class="modal-section">
                                            <h3>Filters</h3>
                                            <p class="text-lg">${nodeInfo?.filters?.join(', ') ?? 'Unknown'}</p>
                                        </div>
                                    </div>`;
                                modal.classList.remove('hidden');
                                modal.style.display = 'flex';
                            });

                            statsDiv.appendChild(card);
                        });
                    }
                } catch (err) {
                    console.error('Error:', err);
                }
            }

            fetchStats();
            setInterval(fetchStats, 60000);
        });
    </script>
</body>

</html>
